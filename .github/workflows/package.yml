  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    uses: normlanguage/registry/.github/workflows/package.yml@77a26aef21f97b65c6343faf621412d91fed7a92
    with:
      norm-version: 0.27.12




